apiVersion: batch/v1
kind: CronJob
metadata:
  name: pingbot-reset
  labels:
    app: pingbot-collector
spec:
  schedule: "0 5 * * *"
  timeZone: Etc/UTC
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 300
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        metadata:
          labels:
            app: pingbot-collector
        spec:
          restartPolicy: OnFailure
          containers:
            - name: reset
              image: ghcr.io/krammygod/pingbot
              imagePullPolicy: IfNotPresent
              args: ["node", "--enable-source-maps", "dist/modules/reset_db"]
              envFrom:
                - secretRef:
                    name: pingbot-secrets
                - configMapRef:
                    name: pingbot-config
                - configMapRef:
                    name: postgres-config
              env:
                - name: PGUSER
                  valueFrom:
                    secretKeyRef:
                      name: postgres-secret
                      key: username
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: postgres-secret
                      key: password
